name: Build Windows EXE

# ── Triggers ──────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:          # กด Run manually จาก GitHub UI ได้

# ── Jobs ──────────────────────────────────────────────────────
jobs:
  build:
    name: Build ThaiAddressParser.exe
    runs-on: windows-latest   # ใช้ Windows runner ฟรีของ GitHub

    steps:
      # 1. Checkout โค้ด
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. ติดตั้ง Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. ติดตั้ง dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl colorama

      # 4. Build .exe ด้วย PyInstaller
      - name: Build EXE
        run: |
          pyinstaller `
            --name "ThaiAddressParser" `
            --onefile `
            --windowed `
            --add-data "data/thai_administrative_areas.csv;data" `
            --add-data "data/MASTER_DATA_SOURCE.md;data" `
            --add-data "address_parser;address_parser" `
            --hidden-import "address_parser" `
            --hidden-import "address_parser.models" `
            --hidden-import "address_parser.knowledge_base" `
            --hidden-import "address_parser.parser" `
            --hidden-import "openpyxl" `
            --hidden-import "openpyxl.styles" `
            --hidden-import "openpyxl.utils" `
            --hidden-import "colorama" `
            --hidden-import "difflib" `
            --hidden-import "sqlite3" `
            --hidden-import "tkinter" `
            --hidden-import "tkinter.ttk" `
            --hidden-import "tkinter.filedialog" `
            --hidden-import "tkinter.messagebox" `
            --noconfirm `
            gui_app.py

      # 5. ตรวจว่า exe ถูกสร้าง
      - name: Verify EXE exists
        run: |
          dir dist\
          echo "EXE size:"
          (Get-Item dist\ThaiAddressParser.exe).length / 1MB

      # 6. Upload เป็น artifact (ดาวน์โหลดได้ 90 วัน)
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThaiAddressParser-Windows-EXE
          path: dist/ThaiAddressParser.exe
          retention-days: 90

      # 7. (Optional) สร้าง GitHub Release อัตโนมัติถ้า push tag
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ThaiAddressParser.exe
          name: Thai Address Parser ${{ github.ref_name }}
          body: |
            ## Thai Address Parser — Windows EXE

            **วิธีใช้:**
            1. ดาวน์โหลด `ThaiAddressParser.exe`
            2. ดับเบิลคลิกเปิด GUI
            3. เลือกไฟล์ Excel → เลือกคอลัมภ์ที่อยู่ → กด เริ่มแยก

            **ต้องการ:** ไม่ต้องติดตั้ง Python หรือ Library ใดๆ
